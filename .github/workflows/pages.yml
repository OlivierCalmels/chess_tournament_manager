name: Deploy GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build (spectateur)
        env:
          VITE_PUBLIC_STATE_URL: ${{ vars.VITE_PUBLIC_STATE_URL }}
          VITE_PUBLIC_POLL_INTERVAL_MS: ${{ vars.VITE_PUBLIC_POLL_INTERVAL_MS || '30000' }}
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build:spectateur
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
